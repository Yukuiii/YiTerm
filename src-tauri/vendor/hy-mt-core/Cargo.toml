[workspace]

[package]
name = "hy-mt-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Vendored Hunyuan-MT GGUF inference for YiTerm (CPU-only)"

[dependencies]
candle-core = "0.10"
candle-nn = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
half = { version = "2", features = ["bytemuck"] }
memmap2 = "0.9"
byteorder = "1.5"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"
thiserror = "2"
tracing = "0.1"
rand = "0.8"
serde_json = "1"

[features]
default = []
